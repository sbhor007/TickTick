<div
  class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 font-sans"
>
  <div
    class="w-[760px] bg-[#141414] rounded-2xl shadow-2xl flex overflow-hidden border border-white/[0.07]"
  >
    <!-- LEFT PANEL -->
    <div class="w-[52%] p-9 flex flex-col">
      <h2
        class="text-white text-[17px] font-semibold mb-7 text-center tracking-tight"
      >
        {{ mode === "update" ? "Edit List" : "Add List" }}
      </h2>

      <form
        [formGroup]="projectForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col"
      >
        <!-- LIST NAME -->
        <div class="relative mb-5">
          <div
            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none"
          >
            <span class="text-[#555] text-[15px]">☰</span>
          </div>
          <input
            type="text"
            placeholder="List name"
            formControlName="name"
            class="w-full bg-[#1f1f1f] border border-[#2a2a2a] rounded-[10px] pl-10 pr-3.5 py-2.5 text-[#e8e8e8] text-sm placeholder-[#464646] focus:outline-none focus:border-blue-600 transition-colors"
          />
        </div>
        <!-- COLOR -->
        <div class="flex items-center justify-between mb-[18px]">
          <label class="text-[13px] text-[#888]">List Color</label>
          <div class="flex gap-[7px] items-center">
            <!-- TODO:integrate color piker -->
          </div>
        </div>
        <!-- VIEW TYPE -->
        <div class="flex items-center justify-between mb-[18px]">
          <label class="text-[13px] text-[#888]">View Type</label>

          <div
            class="flex bg-[#1c1c1c] p-[3px] rounded-[10px] gap-0.5 border border-[#262626]"
          >
            <!-- List View -->
            <label class="cursor-pointer">
              <input
                type="radio"
                formControlName="viewType"
                [value]="listType.LIST.toString()"
                class="hidden peer"
              />
              <span
                class="px-[13px] py-[7px] rounded-[7px] border text-[15px] block transition-all peer-checked:bg-[#242424] peer-checked:border-blue-800 peer-checked:text-blue-400 text-[#555] border-transparent"
              >
                <i class="pi pi-list"></i>
              </span>
            </label>

            <!-- Grid View -->
            <label class="cursor-pointer">
              <input
                type="radio"
                formControlName="viewType"
                [value]="listType.KANBAN.toString()"
                class="hidden peer"
              />
              <span
                class="px-[13px] py-[7px] rounded-[7px] border text-[15px] block transition-all peer-checked:bg-[#242424] peer-checked:border-blue-800 peer-checked:text-blue-400 text-[#555] border-transparent"
              >
                <i class="pi pi-th-large"></i>
              </span>
            </label>

            <!-- Board View -->
            <label class="cursor-pointer relative">
              <input
                type="radio"
                formControlName="viewType"
                [value]="listType.TIMELINE.toString()"
                class="hidden peer"
              />
              <span
                class="px-[13px] py-[7px] rounded-[7px] border text-[15px] block transition-all peer-checked:bg-[#242424] peer-checked:border-blue-800 peer-checked:text-blue-400 text-[#555] border-transparent"
              >
                <i class="pi pi-sliders-h"></i>
                <span
                  class="absolute -top-1 -right-1 text-[9px] text-yellow-500"
                  >👑</span
                >
              </span>
            </label>
          </div>
        </div>
        <div class="h-px bg-[#1f1f1f] mb-[18px]"></div>
        <!-- SETTINGS -->
        <div class="space-y-[18px]">
          <!-- FOLDER -->
          <div class="flex items-center justify-between">
            <label class="text-[13px] text-[#888]">Folder</label>

            <div class="card flex justify-center">
              <select
                formControlName="folderId"
                class="w-full bg-[#1c1c1c] border border-[#2a2a2a] rounded-[9px] px-3 py-2 pr-8 text-[13px] text-[#ccc] appearance-none outline-none cursor-pointer focus:border-blue-600"
              >
                <option value=null>None</option>

                @for (folder of allFolders(); track folder.id) {
                  <option [value]="folder.id">{{ folder.name }}</option>
                }

                <option
                  value="new"
                  class="text-blue-400 font-medium"
                  (click)="isShowFolderDialog.set(true)"
                >
                  + New Folder
                </option>
              </select>

            </div>
          </div>

          <!-- LIST TYPE -->
<div class="flex items-center justify-between">
  <label class="text-[13px] text-[#888]">List Type</label>
  <div class="card flex justify-center">
    <select
      formControlName="listType"
      class="bg-[#1c1c1c] border border-[#2a2a2a] rounded-[8px] px-3 py-2 text-[#e8e8e8] text-sm focus:outline-none focus:border-blue-600 min-w-[14rem]"
    >
      <option value="Task List" selected>Task List</option>
      <option value="Note List">Note List</option>
    </select>
  </div>
</div>

<!-- SMART LIST VIEW -->
<div class="flex items-center justify-between">
  <label class="text-[13px] text-[#888]">Smart List View</label>
  <div class="card flex justify-center">
    <select
      formControlName="smartList"
      class="bg-[#1c1c1c] border border-[#2a2a2a] rounded-[8px] px-3 py-2 text-[#e8e8e8] text-sm focus:outline-none focus:border-blue-600 min-w-[14rem]"
    >
      <option value="All Task" selected>All Task</option>
      <option value="Do not Show">Do not Show</option>
    </select>
  </div>
</div>
          <!-- ACTIONS -->
          <div class="mt-6 flex gap-2.5">
            <button
              type="button"
              (click)="closeForm()"
              class="flex-1 py-2.5 rounded-[11px] bg-[#1e1e1e] border border-[#2b2b2b] text-[#aaa] hover:bg-[#252525]"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="flex-1 py-2.5 rounded-[11px] bg-blue-600 text-white font-semibold hover:bg-blue-700"
            >
              {{ mode === "update" ? "Save" : "Add List" }}
            </button>
          </div>
        </div>
      </form>
    </div>
    <!-- RIGHT PANEL -->
    <div
      class="w-[48%] bg-[#1c1c1c] p-7 flex flex-col items-center justify-center relative"
    >
      <button
        (click)="closeForm()"
        class="absolute top-4 right-4 text-[#555] hover:text-[#ccc]"
      >
        ✕
      </button>

      <p class="text-[11px] text-[#444] uppercase tracking-widest mb-3.5">
        Preview
      </p>

      <div
        class="w-full bg-[#111] rounded-2xl p-5 border border-white/[0.04] space-y-2.5"
      >
        <div class="h-2 w-14 bg-[#252525] rounded mb-5"></div>

        <div class="flex items-center gap-2.5">
          <div class="w-3 h-3 border border-red-500/40"></div>
          <div class="h-1.5 w-[55%] bg-[#1f1f1f] rounded"></div>
        </div>

        <div class="flex items-center gap-2.5">
          <div class="w-3 h-3 border border-blue-500/40"></div>
          <div class="h-1.5 w-[75%] bg-[#1f1f1f] rounded"></div>
        </div>

        <div class="flex items-center gap-2.5">
          <div class="w-3 h-3 border border-[#222]"></div>
          <div class="h-1.5 w-[65%] bg-[#1f1f1f] rounded"></div>
        </div>
      </div>
    </div>
  </div>
  `
</div>

<!-- FOLDER DIALOG -->
@if (isShowFolderDialog()) {
  <!-- <app-folder-dialog [mode]="'create'" (dialogClose)="handleDialog($event)">
  </app-folder-dialog> -->
  <app-create-folder
    [mode]="'create'"
    (folderEvent)="handleFolderEvent($event)"
  >
    "
  </app-create-folder>
}
