@if (pinnedData().length > 0) {
  <div>
    <p-menu
      #contextMenuOptions
      [model]="contextMenu"
      [popup]="true"
      appendTo="body"
    />

    <div class="flex flex-wrap gap-1.5 px-2">
      @for (p of pinnedData(); track $index) {
        <div
          class="relative group"
          [routerLink]="['project/tasks', p.id]"
          (contextmenu)="openContextMenu(p.entityType, p.id, p, $event)"
        >
          <div class="flex flex-col items-center justify-center gap-1 w-[52px] h-[52px] rounded-lg hover:bg-[#323236] cursor-pointer transition-colors">
            <i [ngClass]="getEntityIcon(p.entityType)" class="text-[14px]"></i>
            <span class="text-[10px] text-gray-400 truncate w-full text-center px-0.5">
              {{ p.name || p.title }}
            </span>
          </div>
        </div>
      }
    </div>
  </div>
  <div class="px-3 border-t border-gray-800 mt-auto"></div>
}
