<div class="card h-screen">
  <p-splitter 
    [panelSizes]="ui.detailPanelVisible() ? [25, 100] : [0, 100]"
    [minSizes]="[0, 50]"
    styleClass="h-full"
    class="w-full h-full"
  >
    <ng-template pTemplate="panel">
      <div class="h-full p-2 overflow-y-auto"
           [class.hidden]="!ui.detailPanelVisible()">
        <app-list-action class="w-full"></app-list-action>
      </div>
    </ng-template>

    <ng-template pTemplate="panel">
      <div class="h-full overflow-y-auto">
        <router-outlet></router-outlet>
      </div>
    </ng-template>
  </p-splitter>
</div>
