<div
  class="fixed inset-0 bg-black/55 flex items-center gap-3 justify-center z-50"
>
  <!-- form -->
  <div
    class="bg-[#1c1c1f] rounded-[14px] w-[440px] p-5 border border-white/[0.09]"
    (click)="$event.stopPropagation()"
    [formGroup]="tagForm"
  >
    <!-- Header -->
    <div class="flex items-center justify-between mb-[18px]">
      <span class="text-[15px] font-medium text-white/90">{{ title }}</span>
      <button
        class="w-6 h-6 flex items-center justify-center rounded-md text-white/40 hover:text-white/75 hover:bg-white/[0.07] transition-colors"
        (click)="onClose()"
      >
        <i class="pi pi-times text-xs"></i>
      </button>
    </div>

    <div class="card flex ] w-full mb-5">
      <input
        type="text"
        class="w-full px-3"
        pInputText
        formControlName="name"
        placeholder="nane"
      />
    </div>

    <!-- color picker -->
    <div
      class="flex items-center gap-1.5 px-2 py-1.5 rounded-lg border border-white/[0.12] w-fit"
    >
      <!-- none -->
      <div
        class="w-4 h-4 rounded-full cursor-pointer border border-white/20 flex items-center justify-center"
        [ngClass]="{ 'ring-1 ring-offset-1 ring-white': !selectedColor }"
        (click)="selectColor('')"
      >
        <span
          style="
            width: 10px;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
            transform: rotate(-45deg);
            display: block;
          "
        ></span>
      </div>

      @for (color of colors; track color) {
        <div
          class="w-4 h-4 rounded-full cursor-pointer transition-transform hover:scale-110"
          [style.background]="color"
          [ngClass]="{
            'ring-1 ring-offset-1 ring-white scale-110':
              selectedColor === color,
          }"
          (click)="selectColor(color)"
        ></div>
      }
    </div>
    <!-- implement reusable component -->

    @if (mode !== "update" && existingTag?.entityType != "TAG") {
      @if (mode !== "create_subtag") {
        <div class="flex items-center gap-3 my-3">
          <span class="text-[13px] text-white/50 min-w-[72px]">Parent Tag</span>
          <select
            formControlName="parentId"
            class="flex-1 bg-[#111113] border border-white/[0.12] rounded-xl px-2.5 py-2 text-[13px] text-white/75 outline-none cursor-pointer appearance-none"
          >
            <option [value]="null">None</option>
            @for (tag of parentTags; track tag.id) {
              <option [value]="tag.id">{{ tag.name }}</option>
            }
          </select>
        </div>
      }
    } @else {
      <div class="mb-5"></div>
    }

    <!-- Footer -->
    <div class="flex justify-end gap-2">
      <button
        type="button"
        class="px-5 py-2 rounded-lg text-[13.5px] font-medium bg-white/[0.07] text-white/70 border border-white/[0.1] hover:bg-white/[0.11] transition-colors"
        (click)="onClose()"
      >
        Close
      </button>

      <button
        type="button"
        class="px-5 py-2 rounded-lg text-[13.5px] font-medium text-white transition-opacity disabled:opacity-40"
        [ngClass]="
          isUpdate
            ? 'bg-amber-500 hover:opacity-88'
            : 'bg-[#3b7ff5] hover:opacity-88'
        "
        [disabled]="tagForm.invalid"
        (click)="onSave()"
      >
        {{ saveLabel }}
      </button>
    </div>
  </div>
</div>
